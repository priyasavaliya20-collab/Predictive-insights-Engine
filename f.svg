<circle cx="105" cy="290" r="5" fill="#7440A8"/>
<circle cx="135" cy="310" r="5" fill="#A86BD0"/>
<circle cx="165" cy="303" r="5" fill="#D89BEF"/>
<circle cx="205" cy="270" r="5" fill="#A86BD0"/>

