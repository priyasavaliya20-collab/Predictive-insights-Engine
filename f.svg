<circle cx="280" cy="302" r="5" fill="#7440A8"/>
<circle cx="320" cy="320" r="5" fill="#A86BD0"/>
<circle cx="360" cy="288" r="5" fill="#D89BEF"/>
<circle cx="405" cy="260" r="5" fill="#A86BD0"/>

<text x="275" y="252"
