      font-weight="700" fill="#FFFFFF">01</text>
<text x="550" y="113"
      font-family="Arial" font-size="14"
      font-weight="700" fill="#FFFFFF">Input X</text>

<circle cx="515" cy="178" r="19"
        fill="#A86BD0" filter="url(#glow)"/>
<text x="515" y="182" text-anchor="middle"
