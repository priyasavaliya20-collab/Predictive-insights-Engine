      font-weight="700" fill="#FFFFFF">03</text>
<text x="550" y="253"
      font-family="Arial" font-size="14"
      font-weight="700" fill="#FFFFFF">Fit Curve</text>

<circle cx="515" cy="318" r="19"
        fill="#D89BEF" filter="url(#glow)"/>
<text x="515" y="322" text-anchor="middle"
      font-family="Arial" font-size="10"
      font-weight="700" fill="#FFFFFF">04</text>
<text x="550" y="323"
      font-family="Arial" font-size="14"
      font-weight="700" fill="#FFFFFF">Predict</text>

<!-- RIGHT ENGINE -->
<rect x="760" y="45" width="380" height="176"
      rx="22" fill="#171020"
      stroke="#A86BD0" stroke-width="1.5"/>

<text x="950" y="80"
      text-anchor="middle"
      font-family="Arial" font-size="10"
      font-weight="600" letter-spacing="2"
      fill="#A86BD0">POLYNOMIAL ENGINE</text>

<!-- ROUND RING — INNER LINE REMOVED -->
<circle cx="835" cy="133" r="40"
        fill="none"
        stroke="#7440A8"
        stroke-width="9"
        stroke-dasharray="95 35">

  <animateTransform
    attributeName="transform"
    type="rotate"
    from="0 835 133"
    to="360 835 133"
    dur="10s"
    repeatCount="indefinite"/>
</circle>

<!-- CENTER DOT ONLY -->
<circle cx="835" cy="133" r="11"
        fill="#D89BEF"
        filter="url(#glow)">
  <animate attributeName="r"
           values="9;14;9"
           dur="2.5s"
           repeatCount="indefinite"/>
</circle>

<circle cx="835" cy="93" r="5" fill="#A86BD0"/>

<circle cx="795" cy="93" r="4" fill="#D89BEF">
