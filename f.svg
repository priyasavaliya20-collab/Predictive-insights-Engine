<text x="78" y="240"
      font-family="Arial" font-size="10"
      font-weight="600" letter-spacing="1.5"
      fill="#A86BD0">NON-LINEAR RELATIONSHIP</text>

<line x1="82" y1="330" x2="430" y2="330"
      stroke="#7440A8" stroke-width="2"/>

<line x1="82" y1="330" x2="82" y2="258"
      stroke="#7440A8" stroke-width="2"/>

<!-- POLYNOMIAL CURVE -->
<path d="M90 275
         C125 315,155 315,185 288
         C215 258,245 265,275 300
         C305 335,340 320,365 282
         C385 252,405 258,425 270"
      fill="none"
      stroke="#D89BEF"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-dasharray="520"
      stroke-dashoffset="520"
      filter="url(#glow)">
  <animate attributeName="stroke-dashoffset"
           values="520;0;520"
           dur="7s"
           repeatCount="indefinite"/>
</path>

