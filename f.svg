<!-- diagonal perfect prediction -->

<line x1="100" y1="320"
      x2="410" y2="265"
      stroke="#7440A8"
      stroke-width="2"
      stroke-dasharray="6 6"
      opacity=".7"/>


<!-- actual vs predicted points -->

<g fill="#A86BD0">

  <circle cx="125" cy="314" r="5">
    <animate attributeName="cy"
             values="314;309;314"
             dur="2.5s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="158" cy="302" r="5">
    <animate attributeName="cy"
             values="302;297;302"
             dur="2.7s"
             begin=".2s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="191" cy="300" r="5">
    <animate attributeName="cy"
             values="300;294;300"
             dur="2.9s"
             begin=".4s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="225" cy="288" r="5">
    <animate attributeName="cy"
             values="288;282;288"
             dur="3s"
             begin=".6s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="260" cy="283" r="5">
    <animate attributeName="cy"
             values="283;277;283"
             dur="2.8s"
             begin=".8s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="295" cy="279" r="5">
    <animate attributeName="cy"
             values="279;273;279"
             dur="2.6s"
             begin="1s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="330" cy="270" r="5">
    <animate attributeName="cy"
             values="270;264;270"
             dur="2.9s"
             begin="1.2s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="365" cy="267" r="5">
    <animate attributeName="cy"
             values="267;261;267"
             dur="2.7s"
             begin="1.4s"
             repeatCount="indefinite"/>
  </circle>

</g>


<!-- highlighted prediction -->

