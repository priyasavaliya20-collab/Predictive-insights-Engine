<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420"
     viewBox="0 0 1200 420">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#12091A"/>
    <stop offset="100%" stop-color="#1D1028"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- ================= BACKGROUND ================= -->

<rect width="1200"
      height="420"
      rx="25"
      fill="url(#bg)"/>


<!-- subtle ambient glow -->

<circle cx="1040" cy="80" r="90"
        fill="#7440A8"
        opacity=".07">
  <animate attributeName="r"
           values="80;105;80"
           dur="6s"
           repeatCount="indefinite"/>
</circle>

<circle cx="160" cy="330" r="70"
        fill="#A86BD0"
        opacity=".05">
  <animate attributeName="r"
           values="65;85;65"
           dur="7s"
           repeatCount="indefinite"/>
</circle>



<!-- ================= LEFT TITLE ================= -->

<rect x="52" y="42"
