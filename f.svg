           repeatCount="indefinite"/>
</path>

<circle cx="775" cy="258" r="6" fill="#7440A8"/>
<circle cx="850" cy="215" r="6" fill="#A86BD0"/>
<circle cx="900" cy="250" r="6" fill="#D89BEF"/>
<circle cx="985" cy="205" r="6" fill="#A86BD0"/>
<circle cx="1030" cy="235" r="6" fill="#7440A8"/>
<circle cx="1105" cy="230" r="6" fill="#D89BEF"/>

<!-- METRICS -->
<rect x="760" y="304" width="105" height="58"
      rx="14" fill="#171020" stroke="#7440A8"/>

<text x="780" y="327"
      font-family="Arial" font-size="10"
      font-weight="600" fill="#A86BD0">DEGREE</text>

<text x="780" y="348"
      font-family="Arial" font-size="14"
      font-weight="700" fill="#FFFFFF">x²</text>

<rect x="880" y="304" width="105" height="58"
      rx="14" fill="#171020" stroke="#A86BD0"/>

<text x="900" y="327"
      font-family="Arial" font-size="10"
      font-weight="600" fill="#A86BD0">MODEL</text>

<text x="900" y="348"
      font-family="Arial" font-size="14"
      font-weight="700" fill="#FFFFFF">Curved Fit</text>

<rect x="1000" y="304" width="140" height="58"
