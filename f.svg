<svg width="1200" height="420" viewBox="0 0 1200 420"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- ================= BACKGROUND ================= -->

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#100719"/>
    <stop offset="50%" stop-color="#1C0D29"/>
    <stop offset="100%" stop-color="#0A050F"/>
  </linearGradient>

  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7440A8"/>
    <stop offset="100%" stop-color="#A86BD0"/>
  </linearGradient>

  <linearGradient id="lightPurple" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#A86BD0"/>
    <stop offset="100%" stop-color="#D89BEF"/>
  </linearGradient>

  <!-- Glow -->

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="bigGlow">
    <feGaussianBlur stdDeviation="18"/>
  </filter>


  <!-- ================= ANIMATION ================= -->

  <style>

    .appear {
      animation: appear 1.1s ease-out forwards;
    }

    .float {
      animation: floating 4s ease-in-out infinite;
    }

    .float2 {
      animation: floating2 5s ease-in-out infinite;
    }

    .pulse {
      animation: pulse 3s ease-in-out infinite;
    }

    .dataPulse {
      animation: dataPulse 2.8s ease-in-out infinite;
    }

    .dash {
      animation: dash 5s linear infinite;
    }

    @keyframes appear {
      from {
        opacity:0;
        transform:translateY(12px);
      }
      to {
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes floating {
      0%,100% {
        transform:translateY(0);
      }
      50% {
        transform:translateY(-6px);
      }
    }

    @keyframes floating2 {
      0%,100% {
        transform:translateY(0);
      }
      50% {
        transform:translateY(5px);
      }
    }

    @keyframes pulse {
      0%,100% {
        opacity:.55;
      }
      50% {
        opacity:1;
      }
    }

    @keyframes dataPulse {
      0%,100% {
        transform:scale(1);
        opacity:.7;
      }
      50% {
        transform:scale(1.18);
        opacity:1;
      }
    }

    @keyframes dash {
      to {
        stroke-dashoffset:-120;
      }
    }

  </style>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1200"
      height="420"
      rx="24"
      fill="url(#bg)"/>


<!-- Ambient purple glow -->

<circle cx="1080"
        cy="90"
        r="150"
        fill="#7440A8"
        opacity=".09"
        filter="url(#bigGlow)">
  <animate attributeName="opacity"
           values=".05;.13;.05"
