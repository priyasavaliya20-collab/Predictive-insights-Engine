<text x="1020" y="327"
      font-family="Arial" font-size="10"
      font-weight="600" fill="#A86BD0">OUTPUT</text>

<text x="1020" y="348"
      font-family="Arial" font-size="14"
      font-weight="700" fill="#FFFFFF">Prediction</text>

<!-- BOTTOM LINE -->
<line x1="52" y1="392" x2="1140" y2="392"
