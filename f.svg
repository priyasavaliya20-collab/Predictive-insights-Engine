<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">

<defs>
  <linearGradient id="bgH" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#12091A"/>
    <stop offset="100%" stop-color="#1D1028"/>
  </linearGradient>

  <filter id="glowH">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- BACKGROUND -->
<rect width="1200" height="420" rx="25" fill="url(#bgH)"/>

<circle cx="1050" cy="75" r="105" fill="#7440A8" opacity=".07">
  <animate attributeName="r"
           values="85;110;85"
           dur="6s"
           repeatCount="indefinite"/>
</circle>

<!-- PART H -->
<rect x="52" y="42" width="118" height="30" rx="16"
      fill="#7440A8" opacity=".25" stroke="#7440A8"/>

<text x="111" y="62"
      text-anchor="middle"
      font-family="Arial"
      font-size="11"
      font-weight="700"
      letter-spacing="2"
      fill="#D89BEF">PART H</text>

<!-- TITLE -->
<text x="52" y="120"
      font-family="Arial"
      font-size="31"
      font-weight="700"
      fill="#FFFFFF">Bias–Variance</text>

<text x="52" y="162"
      font-family="Arial"
      font-size="33"
      font-weight="700"
      fill="#D89BEF">Model Diagnostics</text>

<rect x="52" y="180" width="78" height="4"
      rx="2" fill="#7440A8"/>

<rect x="137" y="180" width="37" height="4"
      rx="2" fill="#D89BEF"/>


<!-- LEFT: BIAS VARIANCE -->
<rect x="52" y="213" width="406" height="146"
      rx="20" fill="#171020"
      stroke="#7440A8" stroke-width="1.5"/>

<text x="78" y="240"
      font-family="Arial"
      font-size="10"
      font-weight="600"
      letter-spacing="1.5"
      fill="#A86BD0">BIAS ↔ VARIANCE</text>

<!-- Balance line -->
<line x1="95" y1="330" x2="415" y2="330"
      stroke="#7440A8" stroke-width="2"/>

<!-- Bias curve -->
<path d="M100 275
         C145 280,185 295,225 315
         C260 330,300 335,335 330"
      fill="none"
      stroke="#7440A8"
      stroke-width="3"
      stroke-linecap="round"/>

<!-- Variance curve -->
<path d="M100 330
         C140 330,180 325,220 315
         C265 300,310 275,350 260
         C380 250,400 248,420 250"
      fill="none"
      stroke="#D89BEF"
      stroke-width="3"
      stroke-linecap="round"/>

<!-- Total error -->
<path d="M100 290
         C150 285,190 292,225 310
         C260 325,295 320,330 290
         C365 265,395 255,420 258"
      fill="none"
      stroke="#A86BD0"
      stroke-width="2"
      stroke-dasharray="7 5"/>

<!-- Optimal point -->
<circle cx="225" cy="315" r="7"
        fill="#D89BEF"
        filter="url(#glowH)">
  <animate attributeName="r"
           values="6;10;6"
           dur="2s"
           repeatCount="indefinite"/>
</circle>

<line x1="225" y1="315" x2="225" y2="330"
      stroke="#D89BEF"
      stroke-width="1"
      stroke-dasharray="3 3"/>

<text x="193" y="350"
      font-family="Arial"
      font-size="9"
      font-weight="700"
      fill="#D89BEF">BALANCE</text>

<text x="95" y="265"
      font-family="Arial"
      font-size="10"
      fill="#A86BD0">Bias</text>

<text x="370" y="245"
      font-family="Arial"
      font-size="10"
      fill="#D89BEF">Variance</text>


<!-- CENTER FLOW -->
<text x="500" y="78"
      font-family="Arial"
      font-size="10"
      font-weight="600"
      letter-spacing="2"
      fill="#A86BD0">MODEL DIAGNOSTICS</text>

<line x1="515" y1="106" x2="515" y2="320"
      stroke="#7440A8"
      stroke-width="2"
      stroke-dasharray="8 8">
  <animate attributeName="stroke-dashoffset"
           values="0;-32"
           dur="2s"
           repeatCount="indefinite"/>
</line>

<!-- 01 -->
<circle cx="515" cy="108" r="19"
        fill="#7440A8" filter="url(#glowH)"/>

<text x="515" y="112"
      text-anchor="middle"
      font-family="Arial"
      font-size="10"
      font-weight="700"
      fill="#FFFFFF">01</text>

<text x="550" y="113"
      font-family="Arial"
      font-size="14"
      font-weight="700"
      fill="#FFFFFF">Check Bias</text>

<!-- 02 -->
<circle cx="515" cy="178" r="19"
        fill="#A86BD0" filter="url(#glowH)"/>

<text x="515" y="182"
      text-anchor="middle"
      font-family="Arial"
      font-size="10"
      font-weight="700"
      fill="#FFFFFF">02</text>

<text x="550" y="183"
      font-family="Arial"
      font-size="14"
      font-weight="700"
      fill="#FFFFFF">Check Variance</text>

<!-- 03 -->
<circle cx="515" cy="248" r="19"
        fill="#7440A8" filter="url(#glowH)"/>

<text x="515" y="252"
      text-anchor="middle"
      font-family="Arial"
      font-size="10"
      font-weight="700"
      fill="#FFFFFF">03</text>

<text x="550" y="253"
      font-family="Arial"
      font-size="14"
      font-weight="700"
      fill="#FFFFFF">Detect Overfit</text>

<!-- 04 -->
<circle cx="515" cy="318" r="19"
        fill="#D89BEF" filter="url(#glowH)"/>

<text x="515" y="322"
      text-anchor="middle"
      font-family="Arial"
      font-size="10"
      font-weight="700"
      fill="#FFFFFF">04</text>

<text x="550" y="323"
      font-family="Arial"
      font-size="14"
      font-weight="700"
      fill="#FFFFFF">Diagnose Model</text>


<!-- RIGHT DIAGNOSTIC ENGINE -->
<rect x="760" y="45" width="380" height="176"
      rx="22" fill="#171020"
      stroke="#A86BD0" stroke-width="1.5"/>

<text x="950" y="80"
      text-anchor="middle"
      font-family="Arial"
      font-size="10"
      font-weight="600"
      letter-spacing="2"
      fill="#A86BD0">DIAGNOSTIC ENGINE</text>

<!-- ROUND RING -->
<circle cx="835" cy="133" r="40"
        fill="none"
        stroke="#7440A8"
        stroke-width="9"
        stroke-dasharray="95 35">

  <animateTransform
    attributeName="transform"
    type="rotate"
    from="0 835 133"
    to="360 835 133"
    dur="10s"
    repeatCount="indefinite"/>
</circle>

<!-- CENTER DOT ONLY -->
<circle cx="835" cy="133" r="11"
        fill="#D89BEF"
        filter="url(#glowH)">
  <animate attributeName="r"
           values="9;14;9"
           dur="2.5s"
           repeatCount="indefinite"/>
</circle>

<circle cx="835" cy="93" r="5" fill="#A86BD0"/>

<circle cx="795" cy="93" r="4" fill="#D89BEF">
  <animate attributeName="cy"
           values="93;85;93"
           dur="2.5s"
           repeatCount="indefinite"/>
</circle>

<circle cx="891" cy="157" r="4" fill="#7440A8">
  <animate attributeName="cy"
           values="157;165;157"
           dur="3s"
           repeatCount="indefinite"/>
</circle>

<!-- ENGINE TEXT -->
<text x="920" y="120"
      font-family="Arial"
      font-size="27"
      font-weight="700"
      fill="#FFFFFF">Balance</text>

<text x="920" y="151"
      font-family="Arial"
      font-size="27"
      font-weight="700"
      fill="#D89BEF">
  Generalization
  <animate attributeName="opacity"
           values=".7;1;.7"
           dur="3.5s"
           repeatCount="indefinite"/>
</text>

<rect x="920" y="173" width="110" height="5"
      rx="3" fill="#7440A8"/>

<rect x="1038" y="173" width="48" height="5"
      rx="3" fill="#D89BEF"/>


<!-- BOTTOM DIAGNOSTIC GRAPH -->
<line x1="770" y1="282" x2="1125" y2="282"
      stroke="#7440A8" stroke-width="1.5"/>

<!-- Training error -->
<path d="M775 250
         C830 260,875 280,920 300
         C965 315,1010 320,1105 322"
      fill="none"
      stroke="#7440A8"
      stroke-width="2.5"
      stroke-dasharray="500"
      stroke-dashoffset="500">

  <animate attributeName="stroke-dashoffset"
           values="500;0;500"
           dur="8s"
           repeatCount="indefinite"/>
</path>

<!-- Validation error -->
<path d="M775 315
         C820 300,860 275,900 265
         C940 255,975 260,1010 280
         C1045 300,1075 315,1105 320"
      fill="none"
      stroke="#D89BEF"
      stroke-width="2.5"
      stroke-dasharray="500"
      stroke-dashoffset="500">

  <animate attributeName="stroke-dashoffset"
           values="500;0;500"
           dur="8s"
           begin="1s"
           repeatCount="indefinite"/>
</path>

<!-- Diagnostic points -->
<circle cx="900" cy="265" r="6" fill="#D89BEF"/>
<circle cx="965" cy="315" r="6" fill="#A86BD0"/>

<circle cx="1010" cy="280" r="6"
        fill="#D89BEF"
        filter="url(#glowH)">
  <animate attributeName="r"
           values="5;9;5"
           dur="2s"
           repeatCount="indefinite"/>
</circle>

<text x="775" y="245"
      font-family="Arial"
      font-size="9"
      fill="#A86BD0">TRAIN ERROR</text>

<text x="1020" y="250"
      font-family="Arial"
      font-size="9"
      fill="#D89BEF">VALIDATION</text>


<!-- METRIC CARDS -->
<rect x="760" y="304" width="105" height="58"
      rx="14" fill="#171020" stroke="#7440A8"/>

<text x="780" y="327"
      font-family="Arial"
      font-size="10"
      font-weight="600"
      fill="#A86BD0">BIAS</text>

<text x="780" y="348"
      font-family="Arial"
      font-size="14"
      font-weight="700"
      fill="#FFFFFF">High / Low</text>


<rect x="880" y="304" width="105" height="58"
      rx="14" fill="#171020" stroke="#A86BD0"/>

<text x="900" y="327"
      font-family="Arial"
      font-size="10"
      font-weight="600"
      fill="#A86BD0">VARIANCE</text>

<text x="900" y="348"
      font-family="Arial"
      font-size="14"
      font-weight="700"
      fill="#FFFFFF">High / Low</text>


<rect x="1000" y="304" width="140" height="58"
      rx="14" fill="#171020" stroke="#D89BEF"/>

<text x="1020" y="327"
      font-family="Arial"
      font-size="10"
      font-weight="600"
      fill="#A86BD0">DIAGNOSIS</text>

<text x="1020" y="348"
      font-family="Arial"
      font-size="14"
      font-weight="700"
      fill="#FFFFFF">Generalization</text>


<!-- BOTTOM LINE -->
<line x1="52" y1="392" x2="1140" y2="392"
      stroke="#7440A8"
      stroke-width="1"
      opacity=".6"/>

<circle cx="1080" cy="392" r="4" fill="#7440A8">
  <animate attributeName="cy"
           values="392;386;392"
           dur="2s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1100" cy="392" r="4" fill="#A86BD0">
  <animate attributeName="cy"
           values="392;384;392"
           dur="2.5s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1120" cy="392" r="4" fill="#D89BEF">
  <animate attributeName="cy"
           values="392;386;392"
           dur="3s"
           repeatCount="indefinite"/>
</circle>

</svg>
