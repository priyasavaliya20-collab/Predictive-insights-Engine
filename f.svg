<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="420"
     viewBox="0 0 1200 420">

<defs>

  <!-- 3 PURPLE SHADES -->
  <linearGradient id="purpleGradient" x1="0" x2="1">
    <stop offset="0" stop-color="#7440A8"/>
    <stop offset="0.5" stop-color="#A86BD0"/>
    <stop offset="1" stop-color="#D89BEF"/>
  </linearGradient>

  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0F0914"/>
    <stop offset="0.55" stop-color="#170D20"/>
    <stop offset="1" stop-color="#21102D"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="shadow">
    <feDropShadow dx="0" dy="8" stdDeviation="10"
                  flood-color="#000000"
                  flood-opacity=".55"/>
  </filter>

</defs>


<!-- ================= BACKGROUND ================= -->

<rect width="1200"
      height="420"
      rx="28"
      fill="url(#background)"/>


<!-- PURPLE AMBIENT GLOW -->

<circle cx="1050"
        cy="90"
        r="120"
        fill="#A86BD0"
        opacity=".12"
        filter="url(#glow)">

  <animate attributeName="r"
           values="90;125;90"
           dur="5s"
           repeatCount="indefinite"/>
</circle>


<!-- ================= TITLE ================= -->

<text x="62"
      y="105"
      font-family="Georgia, serif"
      font-size="48"
      font-weight="700"
      fill="#FFFFFF">
  Predictive
</text>

<text x="62"
      y="160"
      font-family="Georgia, serif"
      font-size="48"
      font-weight="700"
      fill="url(#purpleGradient)">
  Insight Engine
</text>


<!-- SUBTITLE -->

<text x="64"
      y="198"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="700"
      fill="#D89BEF">
  Data Preprocessing &amp; Feature Engineering
</text>

<text x="64"
      y="225"
      font-family="Arial, sans-serif"
      font-size="13"
      fill="#B99AC8">
  Transforming raw data into predictive insights
</text>


<!-- ================= ANALYTICS CARD ================= -->

<g transform="translate(60 260)"
   filter="url(#shadow)">

  <rect width="475"
        height="105"
        rx="20"
        fill="#1B1025"
        stroke="#7440A8"
        stroke-width="1.5"/>


  <!-- WINDOW DOTS -->

  <circle cx="25"
          cy="22"
          r="5"
          fill="#7440A8"/>

  <circle cx="43"
          cy="22"
          r="5"
          fill="#A86BD0"/>

  <circle cx="61"
          cy="22"
          r="5"
          fill="#D89BEF"/>


  <text x="82"
        y="26"
        font-family="monospace"
        font-size="10"
        fill="#A86BD0">
    predictive_engine
  </text>


  <!-- GRAPH -->

  <polyline
    points="
      25,76
      65,64
      105,70
      145,43
      185,58
      225,35
      265,50
      305,25
      345,42
      385,20
      425,31"
    fill="none"
    stroke="url(#purpleGradient)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)">

    <animate
      attributeName="stroke-dasharray"
      values="0,500;500,0;0,500"
      dur="5s"
      repeatCount="indefinite"/>

  </polyline>


  <!-- GRAPH POINTS -->

  <circle cx="145"
          cy="43"
          r="4"
          fill="#D89BEF"
          filter="url(#glow)"/>

  <circle cx="305"
          cy="25"
          r="4"
          fill="#A86BD0"
          filter="url(#glow)"/>

  <circle cx="425"
          cy="31"
          r="4"
          fill="#D89BEF"
          filter="url(#glow)"/>


  <!-- GRAPH LABELS -->

  <text x="25"
        y="94"
        font-family="monospace"
        font-size="9"
        fill="#8D6BA2">
    RAW
  </text>

  <text x="150"
        y="94"
        font-family="monospace"
        font-size="9"
        fill="#8D6BA2">
    CLEAN
  </text>

  <text x="280"
        y="94"
        font-family="monospace"
        font-size="9"
        fill="#8D6BA2">
    FEATURES
  </text>

  <text x="405"
        y="94"
        font-family="monospace"
        font-size="9"
        fill="#D89BEF">
    READY
  </text>

</g>


<!-- ================= RIGHT PIPELINE ================= -->

<g transform="translate(625 42)">


  <!-- MAIN VERTICAL PIPELINE -->

  <path d="M45 25V340"
        stroke="#7440A8"
        stroke-width="2"/>


  <!-- MOVING ENERGY -->

  <circle r="6"
          fill="#D89BEF"
          filter="url(#glow)">

    <animateMotion
      dur="4s"
      repeatCount="indefinite"
      path="M45 25V340"/>

  </circle>


  <!-- ================= NODE 01 ================= -->

  <g transform="translate(0 20)">

    <circle cx="45"
            cy="20"
            r="20"
            fill="#21102D"
            stroke="#7440A8"
            stroke-width="3"/>

    <text x="45"
          y="25"
          text-anchor="middle"
          font-family="monospace"
          font-size="11"
          fill="#D89BEF">
      01
    </text>


    <rect x="85"
          y="-7"
          width="230"
          height="54"
          rx="14"
          fill="#1B1025"
          stroke="#7440A8"/>


    <text x="105"
          y="16"
          font-family="Arial"
          font-size="13"
          font-weight="700"
          fill="#FFFFFF">
      DATA INGESTION
    </text>

    <text x="105"
          y="34"
          font-family="monospace"
          font-size="9"
          fill="#A88BB7">
      collect • combine • validate
    </text>

  </g>


  <!-- ================= NODE 02 ================= -->

  <g transform="translate(0 95)">

    <circle cx="45"
            cy="20"
            r="20"
            fill="#21102D"
            stroke="#A86BD0"
            stroke-width="3"/>


    <path d="M36 20L42 26L55 12"
          fill="none"
          stroke="#D89BEF"
          stroke-width="3"/>


    <rect x="85"
          y="-7"
          width="230"
          height="54"
          rx="14"
          fill="#1B1025"
          stroke="#7440A8"/>


    <text x="105"
          y="16"
          font-family="Arial"
          font-size="13"
          font-weight="700"
          fill="#FFFFFF">
      DATA CLEANING
    </text>

    <text x="105"
          y="34"
          font-family="monospace"
          font-size="9"
          fill="#A88BB7">
      missing values • duplicates • outliers
    </text>

  </g>


  <!-- ================= NODE 03 ================= -->

  <g transform="translate(0 170)">

    <circle cx="45"
            cy="20"
            r="20"
            fill="#21102D"
            stroke="#D89BEF"
            stroke-width="3"/>


    <polyline
      points="34,28 41,18 48,23 58,10"
      fill="none"
      stroke="#D89BEF"
      stroke-width="3"/>


    <rect x="85"
          y="-7"
          width="230"
          height="54"
          rx="14"
          fill="#1B1025"
          stroke="#7440A8"/>


    <text x="105"
          y="16"
          font-family="Arial"
          font-size="13"
          font-weight="700"
          fill="#FFFFFF">
      FEATURE ENGINEERING
    </text>

    <text x="105"
          y="34"
          font-family="monospace"
          font-size="9"
          fill="#A88BB7">
      create • select • transform
    </text>

  </g>


  <!-- ================= NODE 04 ================= -->

  <g transform="translate(0 245)">

    <circle cx="45"
            cy="20"
            r="20"
            fill="#21102D"
            stroke="#A86BD0"
            stroke-width="3"/>


    <text x="45"
          y="25"
          text-anchor="middle"
          font-family="monospace"
          font-size="10"
          fill="#D89BEF">
      ML
    </text>


    <rect x="85"
          y="-7"
          width="230"
          height="54"
          rx="14"
          fill="#1B1025"
          stroke="#7440A8"/>


    <text x="105"
          y="16"
          font-family="Arial"
          font-size="13"
          font-weight="700"
          fill="#FFFFFF">
      PREDICTIVE MODEL
    </text>

    <text x="105"
          y="34"
          font-family="monospace"
          font-size="9"
          fill="#A88BB7">
      patterns • prediction • insights
    </text>

  </g>

</g>


<!-- ================= FLOATING METRICS ================= -->

<g filter="url(#shadow)">


  <g transform="translate(1000 235)">

    <rect width="135"
          height="58"
          rx="15"
          fill="#1B1025"
          stroke="#7440A8"/>

    <text x="17"
          y="21"
          font-family="monospace"
          font-size="8"
          fill="#A88BB7">
      INSIGHT SCORE
    </text>

    <text x="17"
          y="45"
          font-family="Arial"
          font-size="20"
          font-weight="800"
          fill="#D89BEF">
      98.4%
    </text>

  </g>


  <g transform="translate(1000 310)">

    <rect width="135"
          height="58"
          rx="15"
          fill="#1B1025"
          stroke="#A86BD0"/>

    <text x="17"
          y="21"
          font-family="monospace"
          font-size="8"
          fill="#A88BB7">
      DATA QUALITY
    </text>

    <text x="17"
          y="45"
          font-family="Arial"
          font-size="20"
          font-weight="800"
          fill="#A86BD0">
      READY
    </text>

  </g>

</g>


<!-- ================= PURPLE PARTICLES ================= -->

<g fill="#D89BEF"
   filter="url(#glow)">

  <circle cx="550"
          cy="55"
          r="3">

    <animate attributeName="cy"
             values="55;38;55"
             dur="2.5s"
             repeatCount="indefinite"/>

  </circle>


  <circle cx="950"
          cy="75"
          r="3">

    <animate attributeName="cy"
             values="75;58;75"
             dur="2.2s"
             repeatCount="indefinite"/>

  </circle>


  <circle cx="1160"
          cy="170"
          r="2">

    <animate attributeName="opacity"
             values=".2;1;.2"
             dur="1.7s"
             repeatCount="indefinite"/>

  </circle>

</g>


<!-- ================= BOTTOM PURPLE LINE ================= -->

<path d="M0 400H1200"
      stroke="#7440A8"
      stroke-width="2"
      opacity=".7"/>

<path d="M0 400H1200"
      stroke="#D89BEF"
      stroke-width="1"
      stroke-dasharray="35 25"
      opacity=".5">

  <animate
    attributeName="stroke-dashoffset"
    values="0;-60"
    dur="1.2s"
    repeatCount="indefinite"/>

</path>

</svg>
