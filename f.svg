 <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">

<defs>

  <!-- BACKGROUND -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0B0611"/>
    <stop offset="50%" stop-color="#171021"/>
    <stop offset="100%" stop-color="#261333"/>
  </linearGradient>

  <!-- PREMIUM CARD -->
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#251832"/>
    <stop offset="100%" stop-color="#130D1B"/>
  </linearGradient>

  <!-- PURPLE ACCENT -->
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7440A8"/>
    <stop offset="50%" stop-color="#A86BD0"/>
    <stop offset="100%" stop-color="#D89BEF"/>
  </linearGradient>

  <!-- VERTICAL ACCENT -->
  <linearGradient id="purpleV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#D89BEF"/>
    <stop offset="100%" stop-color="#7440A8"/>
  </linearGradient>

  <!-- GLOW -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="bigGlow">
    <feGaussianBlur stdDeviation="12"/>
  </filter>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1200" height="420" rx="28" fill="url(#bg)"/>

<!-- ambient premium glow -->
<circle cx="1040" cy="80" r="150"
        fill="#A86BD0"
        opacity=".045"
        filter="url(#bigGlow)">
  <animate attributeName="r"
           values="130;165;130"
           dur="8s"
           repeatCount="indefinite"/>
</circle>

<circle cx="620" cy="390" r="130"
        fill="#7440A8"
        opacity=".035"
        filter="url(#bigGlow)"/>


<!-- ================================================= -->
<!-- HEADER -->
<!-- ================================================= -->

<rect x="52" y="38"
