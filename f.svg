<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#12091A"/>
    <stop offset="100%" stop-color="#1D1028"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- BACKGROUND -->
<rect width="1200" height="420" rx="25" fill="url(#bg)"/>

<circle cx="1040" cy="75" r="100"
        fill="#7440A8" opacity=".07">
  <animate attributeName="r"
           values="85;110;85"
           dur="6s"
           repeatCount="indefinite"/>
</circle>

<!-- BADGE -->
<rect x="52" y="42"
      width="118"
      height="30"
      rx="16"
      fill="#7440A8"
      opacity=".25"
      stroke="#7440A8">

  <animate attributeName="opacity"
           values=".18;.35;.18"
           dur="4s"
           repeatCount="indefinite"/>
</rect>

<text x="111" y="62"
      text-anchor="middle"
      font-family="Arial"
      font-size="11"
      font-weight="700"
      letter-spacing="2"
      fill="#D89BEF">
  PART E
</text>

<!-- TITLE -->
<text x="52" y="120"
      font-family="Arial"
      font-size="34"
      font-weight="700"
      fill="#FFFFFF">
  Multiple Linear
</text>

<text x="52" y="162"
      font-family="Arial"
      font-size="35"
      font-weight="700"
      fill="#D89BEF">

