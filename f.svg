<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="420"
     viewBox="0 0 1200 420">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#12091A"/>
    <stop offset="100%" stop-color="#1D1028"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- BACKGROUND -->
<rect width="1200"
      height="420"
      rx="25"
      fill="url(#bg)"/>


<!-- subtle background glow -->
<circle cx="1040" cy="75"
        r="100"
        fill="#7440A8"
        opacity=".07">

  <animate attributeName="r"
           values="85;110;85"
           dur="6s"
           repeatCount="indefinite"/>

</circle>


<!-- ================= LEFT TITLE ================= -->

<!-- PART B -->
<rect x="52" y="42"
